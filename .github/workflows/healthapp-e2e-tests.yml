name: Health app E2E Tests

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.45.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install healthapp dependencies
        working-directory: ./healthapp
        run: npm install

      - name: Lint healthapp
        working-directory: ./healthapp
        run: npm run lint

      - name: Start healthapp server
        working-directory: ./healthapp
        env:
          HOST: 0.0.0.0
          PORT: 3000
          CI: true
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Install test dependencies
        working-directory: ./healthapp-tests
        run: npm install

      - name: Run e2e tests
        working-directory: ./healthapp-tests
        run: |
          npx wait-on http://127.0.0.1:3000 --timeout 60000
          npm test

      - name: Print Server Logs on Failure
        if: failure()
        working-directory: ./healthapp
        run: |
          if [ -f server.log ]; then
            echo "=== SERVER LOGS ==="
            cat server.log
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: healthapp-tests/playwright-report/
          retention-days: 30

      - name: Stop healthapp server
        if: always()
        working-directory: ./healthapp
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
